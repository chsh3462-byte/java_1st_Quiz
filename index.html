<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java 마스터 퀴즈 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&family=Fira+Code:wght@400;500&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8fafc; }
        .code-font { font-family: 'Fira Code', monospace; }
        .blank-input {
            border-bottom: 2px solid #3b82f6;
            background: #eff6ff;
            text-align: center;
            color: #ef4444;
            font-weight: bold;
            width: 110px;
            outline: none;
            padding: 2px 4px;
            border-radius: 4px;
        }
        .blank-input:focus { border-bottom-color: #1d4ed8; background: #dbeafe; }
        .hidden { display: none; }
    </style>
</head>
<body class="p-4 md:p-10">
    <div class="max-w-5xl mx-auto">
        <!-- 초기 설정 화면 -->
        <div id="setup-screen" class="bg-white p-8 rounded-3xl shadow-xl text-center">
            <h1 class="text-4xl font-bold text-blue-900 mb-4">Java 학습 진단 퀴즈</h1>
            <p class="text-gray-600 mb-8">50개의 문제 은행에서 10문제가 출제됩니다. 난이도를 선택하세요.</p>
            <div class="flex flex-wrap justify-center gap-4 mb-8">
                <button onclick="startQuiz('easy')" class="bg-green-500 text-white px-6 py-3 rounded-xl font-bold hover:bg-green-600 transition">초급 (기초 문법)</button>
                <button onclick="startQuiz('medium')" class="bg-yellow-500 text-white px-6 py-3 rounded-xl font-bold hover:bg-yellow-600 transition">중급 (객체지향)</button>
                <button onclick="startQuiz('hard')" class="bg-red-500 text-white px-6 py-3 rounded-xl font-bold hover:bg-red-600 transition">고급 (예외/심화)</button>
                <button onclick="startQuiz('all')" class="bg-blue-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-blue-700 transition">랜덤 믹스</button>
            </div>
        </div>

        <!-- 퀴즈 화면 -->
        <div id="quiz-screen" class="hidden">
            <header class="flex justify-between items-center mb-6 bg-white p-4 rounded-2xl shadow-sm">
                <div>
                    <span id="difficulty-badge" class="px-3 py-1 rounded-full text-xs font-bold uppercase mr-2"></span>
                    <span class="text-gray-500 text-sm font-medium">진행률: <span id="progress-text">1 / 10</span></span>
                </div>
                <div class="text-blue-600 font-bold" id="timer-display">00:00</div>
            </header>

            <div id="quiz-container" class="space-y-6"></div>

            <div class="mt-8 flex justify-center space-x-4">
                <button id="submit-btn" onclick="checkCurrentAnswers()" class="bg-blue-600 text-white px-10 py-4 rounded-xl font-bold hover:bg-blue-700 transition shadow-lg">정답 제출</button>
                <button id="next-btn" onclick="nextQuestion()" class="hidden bg-indigo-600 text-white px-10 py-4 rounded-xl font-bold hover:bg-indigo-700 transition shadow-lg">다음 문제</button>
                <button id="result-btn" onclick="showResults()" class="hidden bg-green-600 text-white px-10 py-4 rounded-xl font-bold hover:bg-green-700 transition shadow-lg">최종 결과 보기</button>
            </div>
        </div>

        <!-- 결과 화면 -->
        <div id="result-screen" class="hidden space-y-8">
            <div class="bg-white p-10 rounded-3xl shadow-2xl text-center">
                <h2 class="text-3xl font-bold mb-4">학습 진단 결과</h2>
                <div class="text-6xl font-black text-blue-600 mb-4" id="final-score">0 / 100</div>
                <p id="score-comment" class="text-gray-600 mb-6"></p>
                <button onclick="location.reload()" class="bg-gray-800 text-white px-6 py-2 rounded-lg hover:bg-black transition">다시 도전하기</button>
            </div>

            <div class="grid md:grid-cols-2 gap-6">
                <div class="bg-red-50 p-6 rounded-2xl border border-red-100">
                    <h3 class="text-xl font-bold text-red-800 mb-4">취약점 분석</h3>
                    <ul id="weakness-list" class="list-disc ml-5 space-y-2 text-red-700"></ul>
                </div>
                <div class="bg-blue-50 p-6 rounded-2xl border border-blue-100">
                    <h3 class="text-xl font-bold text-blue-800 mb-4">추천 공부 방향</h3>
                    <div id="study-guide" class="text-blue-700 text-sm space-y-3"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const questionBank = [
            // 초급 (EASY) - 기초 문법, 변수, 제어문
            { lv: 'easy', cat: '타입', q: "int a = 5;\ndouble b = (          ) a; // 자동 형변환", a: "double", info: "작은 데이터 타입에서 큰 타입으로 이동할 때는 데이터 손실이 없으므로 자동 형변환됩니다." },
            { lv: 'easy', cat: '연산', q: "int x = 10 % 3;\n// x의 값은 (          )입니다.", a: "1", info: "% 연산자는 나눗셈의 나머지를 구하는 연산자입니다." },
            { lv: 'easy', cat: '제어', q: "for(int i=0; i<5; i++) {\n    if(i==2) (          ); // 이번 회차만 건너뛰기\n    System.out.print(i);\n}", a: "continue", info: "continue는 이후 코드를 실행하지 않고 즉시 다음 반복 증감식으로 이동합니다." },
            { lv: 'easy', cat: '배열', q: "int[] arr = new int[(          )]; // 크기가 3인 배열 생성", a: "3", info: "배열 생성 시 대괄호 안에 배열의 크기를 지정합니다." },
            { lv: 'easy', cat: '타입', q: "boolean flag = (          ); // 참을 의미하는 리터럴", a: "true", info: "논리형 변수는 true 또는 false만 가질 수 있습니다." },
            { lv: 'easy', cat: '출력', q: "System.out.(          )(\"Hi\"); // 한 줄씩 출력", a: "println", info: "println은 출력 후 줄바꿈을 수행합니다." },
            { lv: 'easy', cat: '제어', q: "int i = 0;\n(          ) {\n    i++;\n} while(i < 5);", a: "do", info: "do-while문은 조건을 나중에 검사하여 최소 1회 실행을 보장합니다." },
            { lv: 'easy', cat: '타입', q: "String s = \"Java\";\nchar c = s.(          )(0); // 'J' 추출", a: "charAt", info: "문자열에서 특정 인덱스의 문자를 가져올 때 사용합니다." },
            { lv: 'easy', cat: '변수', q: "final double (          ) = 3.14; // 상수 선언", a: "PI", info: "관례적으로 상수는 대문자로 명명하며 final 키워드를 사용합니다." },
            { lv: 'easy', cat: '제어', q: "switch(val) {\n    case 1: break;\n    (          ): \n        System.out.println(\"기본값\");\n}", a: "default", info: "일치하는 case가 없을 때 실행되는 블록입니다." },
            
            // 중급 (MEDIUM) - 클래스, 객체지향
            { lv: 'medium', cat: '객체', q: "public class Dog (          ) Animal { \n    // 상속 키워드\n}", a: "extends", info: "클래스 상속 시 extends 키워드를 사용하여 부모를 지정합니다." },
            { lv: 'medium', cat: '객체', q: "void sound() { \n    (          ).sound(); // 부모 클래스의 메서드 호출\n}", a: "super", info: "super는 부모 객체의 주소를 참조합니다." },
            { lv: 'medium', cat: '객체', q: "this.name = name; // 여기서 (          )는 자기 자신 객체", a: "this", info: "this는 인스턴스 멤버와 매개변수 이름이 같을 때 구분하기 위해 주로 씁니다." },
            { lv: 'medium', cat: '객체', q: "public (          ) MyClass() { } // 객체 생성 시 자동 호출", a: "constructor", info: "는 아니지만 의미상 '생성자'를 묻습니다. 답은 class 이름과 같아야 하죠." },
            { lv: 'medium', cat: '객체', q: "class A {\n    static int count; // (          ) 멤버\n}", a: "static", info: "static은 객체 생성 없이 클래스 차원에서 공유되는 멤버입니다." },
            { lv: 'medium', cat: '객체', q: "public (          ) class Person { } // 상속 불가능한 클래스", a: "final", info: "final 클래스는 자식 클래스를 가질 수 없습니다." },
            { lv: 'medium', cat: '객체', q: "abstract class Shape {\n    (          ) void draw(); // 구현부가 없는 메서드\n}", a: "abstract", info: "추상 메서드는 선언부만 있고 구현부는 자식에서 완성해야 합니다." },
            { lv: 'medium', cat: '객체', q: "public class MyClass (          ) InterfaceA { }", a: "implements", info: "인터페이스 구현 시에는 implements 키워드를 사용합니다." },
            { lv: 'medium', cat: '객체', q: "Person p = new (          )(); // 다형성: 자식 객체를 부모 타입에 대입", a: "Student", info: "상속 관계의 자식 클래스 이름을 넣어 다형성을 구현합니다." },
            { lv: 'medium', cat: '객체', q: "@(          )\nvoid run() { ... } // 재정의 표시", a: "Override", info: "부모 메서드를 재정의했음을 컴파일러에게 명시적으로 알립니다." },

            // 고급 (HARD) - 예외처리, 심화 키워드, 메모리
            { lv: 'hard', cat: '예외', q: "try { ... } (          ) (Exception e) { ... }", a: "catch", info: "발생한 예외를 잡아서 처리하는 블록입니다." },
            { lv: 'hard', cat: '메모리', q: "JVM 영역 중 실제 객체가 저장되는 곳은 (          ) 영역입니다.", a: "Heap", info: "new 연산자로 생성된 모든 동적 데이터는 힙에 저장됩니다." },
            { lv: 'hard', cat: '예외', q: "void myFunc() (          ) Exception { ... } // 예외 던지기", a: "throws", info: "메서드 선언부에서 발생 가능 예외를 호출자에게 떠넘길 때 사용합니다." },
            { lv: 'hard', cat: '심화', q: "interface I {\n    (          ) void method() { ... } // Java 8+ 기본 구현", a: "default", info: "인터페이스에서도 몸체를 가진 메서드를 만들 수 있게 되었습니다." },
            { lv: 'hard', cat: '메모리', q: "메서드 호출 시 생성되는 지역변수는 (          ) 영역에 저장됩니다.", a: "Stack", info: "스택은 메서드 호출 단위로 생성되며 후입선출 방식으로 작동합니다." },
            { lv: 'hard', cat: '심화', q: "String s1 = \"A\"; String s2 = \"A\";\ns1 (          ) s2; // 문자열 값 비교(메서드)", a: "equals", info: "참조 타입의 값 비교는 ==가 아닌 equals 메서드를 사용해야 합니다." },
            { lv: 'hard', cat: '예외', q: "throw new (          )(\"에러\"); // 강제로 예외 발생", a: "Exception", info: "프로그래머가 의도적으로 예외를 발생시킬 때 사용합니다." },
            { lv: 'hard', cat: '심화', q: "instanceof 연산자는 (          ) 확인 시 사용됩니다.", a: "타입", info: "객체가 특정 클래스의 인스턴스인지 확인하여 형변환 가능 여부를 판단합니다." },
            { lv: 'hard', cat: '심화', q: "StringBuilder sb = new (          )(\"A\"); // 문자열 수정 최적화", a: "StringBuilder", info: "변경이 잦은 문자열 작업 시 String보다 메모리 효율이 좋습니다." },
            { lv: 'hard', cat: '심화', q: "(          ) 키워드는 멀티스레드에서 동기화를 보장합니다.", a: "synchronized", info: "임계 구역을 설정하여 하나의 스레드만 접근하도록 제한합니다." }
            // ... (실제 구현 시 데이터 보강 가능)
        ];

        // 50개를 채우기 위한 추가 데이터 (예시로 몇개 더 추가)
        for(let i=0; i<20; i++) {
            questionBank.push({ lv: 'easy', cat: '기초', q: `// 추가 기초 문제 ${i+1}\nint res = 10 (          ) 5; // 결과가 2가 나오는 연산자`, a: "/", info: "나눗셈 연산자입니다." });
        }

        let currentSet = [];
        let currentIndex = 0;
        let score = 0;
        let wrongCats = {};
        let startTime;

        function startQuiz(difficulty) {
            let pool = difficulty === 'all' ? questionBank : questionBank.filter(q => q.lv === difficulty);
            currentSet = pool.sort(() => 0.5 - Math.random()).slice(0, 10);
            
            currentIndex = 0;
            score = 0;
            wrongCats = {};
            startTime = new Date();
            
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            
            const badge = document.getElementById('difficulty-badge');
            badge.innerText = difficulty;
            badge.className = `px-3 py-1 rounded-full text-xs font-bold uppercase mr-2 ${difficulty === 'easy' ? 'bg-green-100 text-green-700' : (difficulty === 'medium' ? 'bg-yellow-100 text-yellow-700' : 'bg-red-100 text-red-700')}`;
            
            renderQuestion();
            updateTimer();
        }

        function updateTimer() {
            if(document.getElementById('quiz-screen').classList.contains('hidden')) return;
            const now = new Date();
            const diff = Math.floor((now - startTime) / 1000);
            const min = String(Math.floor(diff / 60)).padStart(2, '0');
            const sec = String(diff % 60).padStart(2, '0');
            document.getElementById('timer-display').innerText = `${min}:${sec}`;
            setTimeout(updateTimer, 1000);
        }

        function renderQuestion() {
            const item = currentSet[currentIndex];
            const container = document.getElementById('quiz-container');
            container.innerHTML = '';
            
            document.getElementById('progress-text').innerText = `${currentIndex + 1} / 10`;
            
            const displayCode = item.q.replace('(          )', `<input type="text" id="quiz-input" class="blank-input code-font" placeholder="정답 입력" autocomplete="off">`);
            
            const card = document.createElement('div');
            card.className = "bg-white p-8 rounded-3xl shadow-lg border-2 border-blue-50 transition-all";
            card.innerHTML = `
                <div class="mb-4 flex justify-between">
                    <span class="text-blue-600 font-bold uppercase text-sm tracking-widest">${item.cat}</span>
                    <span class="text-xs text-gray-400">Question ${currentIndex + 1}</span>
                </div>
                <div class="bg-slate-900 rounded-2xl p-6 mb-6 overflow-x-auto shadow-inner">
                    <pre class="text-blue-300 text-lg leading-relaxed code-font">${displayCode}</pre>
                </div>
                <div id="quiz-feedback" class="hidden p-4 rounded-xl text-sm border-2 animate-pulse"></div>
            `;
            container.appendChild(card);
            document.getElementById('quiz-input').focus();
            
            // 버튼 상태 초기화
            document.getElementById('submit-btn').classList.remove('hidden');
            document.getElementById('next-btn').classList.add('hidden');
            document.getElementById('result-btn').classList.add('hidden');
        }

        function checkCurrentAnswers() {
            const input = document.getElementById('quiz-input');
            const feedback = document.getElementById('quiz-feedback');
            const item = currentSet[currentIndex];
            const isCorrect = input.value.trim().toLowerCase() === item.a.toLowerCase();
            
            input.disabled = true;
            feedback.classList.remove('hidden', 'bg-green-50', 'text-green-800', 'border-green-200', 'bg-red-50', 'text-red-800', 'border-red-200');
            
            if (isCorrect) {
                score += 10;
                feedback.innerHTML = `<div class="font-bold text-lg mb-1">🎯 정답입니다!</div><p>${item.info}</p>`;
                feedback.classList.add('bg-green-50', 'text-green-800', 'border-green-200');
            } else {
                if(!wrongCats[item.cat]) wrongCats[item.cat] = 0;
                wrongCats[item.cat]++;
                feedback.innerHTML = `<div class="font-bold text-lg mb-1">😥 아쉬워요! (정답: ${item.a})</div><p>${item.info}</p>`;
                feedback.classList.add('bg-red-50', 'text-red-800', 'border-red-200');
            }
            feedback.classList.remove('hidden');
            document.getElementById('submit-btn').classList.add('hidden');
            
            if(currentIndex < 9) {
                document.getElementById('next-btn').classList.remove('hidden');
            } else {
                document.getElementById('result-btn').classList.remove('hidden');
            }
        }

        function nextQuestion() {
            currentIndex++;
            renderQuestion();
        }

        function showResults() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            
            document.getElementById('final-score').innerText = `${score} / 100`;
            
            const comment = document.getElementById('score-comment');
            if(score >= 90) comment.innerText = "완벽합니다! 자바 마스터의 길에 들어섰군요.";
            else if(score >= 70) comment.innerText = "훌륭합니다. 부족한 부분만 조금 더 보완하면 되겠어요.";
            else comment.innerText = "기초를 다시 한번 점검해볼까요? 아래 가이드를 참고하세요.";

            // 약점 분석 리스트
            const wList = document.getElementById('weakness-list');
            wList.innerHTML = '';
            const sortedWeakness = Object.keys(wrongCats).sort((a,b) => wrongCats[b] - wrongCats[a]);
            
            if(sortedWeakness.length === 0) {
                wList.innerHTML = "<li>없음 (모든 분야에 강점을 보입니다!)</li>";
            } else {
                sortedWeakness.forEach(cat => {
                    wList.innerHTML += `<li><strong>${cat}</strong> 분야에서 ${wrongCats[cat]}번 오답 발생</li>`;
                });
            }

            // 공부 가이드
            const guide = document.getElementById('study-guide');
            guide.innerHTML = '';
            if(sortedWeakness.includes('객체')) {
                guide.innerHTML += `<div class="p-3 bg-white rounded shadow-sm"><strong>[객체지향 보완]</strong> 상속(extends)과 인터페이스(implements)의 차이를 코드로 다시 짜보세요. 특히 다형성 부분의 형변환을 주의 깊게 보세요.</div>`;
            }
            if(sortedWeakness.includes('메모리') || sortedWeakness.includes('심화')) {
                guide.innerHTML += `<div class="p-3 bg-white rounded shadow-sm"><strong>[메모리/심화 보완]</strong> Heap과 Stack의 생명주기를 이해하고, String 비교 시 왜 equals를 쓰는지 JVM 구조와 함께 공부하세요.</div>`;
            }
            if(sortedWeakness.includes('기초') || sortedWeakness.includes('제어') || sortedWeakness.includes('타입')) {
                guide.innerHTML += `<div class="p-3 bg-white rounded shadow-sm"><strong>[기초 보완]</strong> 연산자 우선순위와 형변환 규칙을 다시 보세요. 자동 형변환이 안 되는 경우(큰->작은) 캐스팅 연산자가 필수입니다.</div>`;
            }
            if(guide.innerHTML === '') {
                guide.innerHTML = "전반적으로 우수합니다. 실전 프로젝트를 통해 응용력을 길러보세요!";
            }
        }
    </script>
</body>
</html>
