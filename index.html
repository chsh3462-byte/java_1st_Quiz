<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Java Master Quiz Engine - 10 Tasks Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700;900&family=Fira+Code:wght@400;500&display=swap');
        
        :root { --transition-speed: 0.5s; }
        body { 
            font-family: 'Noto Sans KR', sans-serif; 
            background-color: #cbd5e1;
            transition: background-color var(--transition-speed);
            margin: 0; padding: 0; overflow-x: hidden;
        }
        .code-font { font-family: 'Fira Code', monospace; }

        #app-wrapper {
            transition: all var(--transition-speed) cubic-bezier(0.4, 0, 0.2, 1);
            margin: 0 auto; min-height: 100vh;
            display: flex; flex-direction: column;
            background-color: #f8fafc; position: relative;
        }

        .mode-mobile #app-wrapper {
            max-width: 420px; box-shadow: 0 0 100px rgba(0,0,0,0.3);
            margin: 20px auto; border-radius: 40px;
            min-height: calc(100vh - 40px); border: 8px solid #1e293b;
            overflow: hidden;
        }

        .mode-pc #app-wrapper { max-width: 100%; margin: 0; border-radius: 0; border: none; }
        .mode-pc body { background-color: #f1f5f9; }

        .blank-input {
            border-bottom: 4px solid #3b82f6; background: rgba(59, 130, 246, 0.1);
            text-align: center; color: #ef4444; font-weight: 900;
            width: 140px; outline: none; padding: 2px 10px;
            border-radius: 12px; font-size: 1.1em; transition: all 0.2s;
        }

        .blank-input:focus { background: #fff; box-shadow: 0 8px 20px rgba(59, 130, 246, 0.2); transform: translateY(-2px); }
        .hidden { display: none; }
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .code-container {
            background-color: #0f172a; border-radius: 1.5rem; padding: 1.5rem;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5); overflow-x: auto;
        }

        .mode-pc .quiz-grid { display: grid; grid-template-columns: 1fr 320px; gap: 2rem; max-width: 1200px; margin: 0 auto; }
        
        .nav-bar {
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px);
            border-bottom: 1px solid #e2e8f0; padding: 1rem 1.5rem;
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 100;
        }

        .floating-switch {
            position: fixed; bottom: 30px; right: 30px;
            background: #1e293b; padding: 6px; border-radius: 20px;
            display: flex; gap: 5px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); z-index: 1000;
        }

        .switch-btn { padding: 8px 16px; border-radius: 15px; font-size: 11px; font-weight: 900; color: #64748b; transition: all 0.3s; }
        .switch-btn.active { background: #3b82f6; color: white; }

        .rank-badge {
            display: inline-block; padding: 6px 16px; border-radius: 12px;
            font-size: 16px; font-weight: 900; color: white; margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .rank-master { background: linear-gradient(45deg, #7c3aed, #db2777); }
        .rank-expert { background: linear-gradient(45deg, #2563eb, #0891b2); }
        .rank-senior { background: linear-gradient(45deg, #059669, #10b981); }
        .rank-junior { background: linear-gradient(45deg, #ca8a04, #fbbf24); }
        .rank-beginner { background: linear-gradient(45deg, #4b5563, #9ca3af); }
    </style>
</head>
<body class="mode-pc">

    <div class="floating-switch">
        <button id="sw-pc" onclick="toggleMode('pc')" class="switch-btn active">PC MODE</button>
        <button id="sw-mb" onclick="toggleMode('mobile')" class="switch-btn">MOBILE</button>
    </div>

    <div id="app-wrapper">
        <nav class="nav-bar">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white font-black shadow-lg shadow-blue-200">J</div>
                <span class="font-black text-slate-800 text-lg tracking-tighter">Java Master v4.5</span>
            </div>
            <div id="mode-indicator" class="px-3 py-1 bg-blue-50 text-blue-600 text-[10px] font-black rounded-full">DESKTOP VIEW</div>
        </nav>

        <main class="flex-grow p-4 md:p-10 overflow-y-auto">
            
            <!-- [1] 로비 화면 -->
            <div id="lobby-screen" class="max-w-4xl mx-auto fade-in">
                <div class="text-center mt-6 mb-12">
                    <h2 class="text-4xl font-black text-slate-900 mb-4">학습 난이도 선택</h2>
                    <p class="text-slate-500 font-medium">실력 측정은 총 10문항으로 구성됩니다.</p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <button onclick="startQuiz('easy')" class="group p-8 bg-white rounded-[2rem] border-2 border-slate-100 text-left hover:border-emerald-500 hover:shadow-2xl transition-all">
                        <div class="w-14 h-14 bg-emerald-50 text-emerald-500 rounded-2xl flex items-center justify-center mb-6">
                            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                        </div>
                        <h3 class="text-xl font-black text-slate-800">초급 (Beginner)</h3>
                        <p class="text-slate-400 text-sm mt-2">기본 문법 & 자료형</p>
                    </button>
                    <button onclick="startQuiz('medium')" class="group p-8 bg-white rounded-[2rem] border-2 border-slate-100 text-left hover:border-blue-500 hover:shadow-2xl transition-all">
                        <div class="w-14 h-14 bg-blue-50 text-blue-500 rounded-2xl flex items-center justify-center mb-6">
                            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
                        </div>
                        <h3 class="text-xl font-black text-slate-800">중급 (Core)</h3>
                        <p class="text-slate-400 text-sm mt-2">객체지향 & 클래스 설계</p>
                    </button>
                    <button onclick="startQuiz('hard')" class="group p-8 bg-white rounded-[2rem] border-2 border-slate-100 text-left hover:border-rose-500 hover:shadow-2xl transition-all">
                        <div class="w-14 h-14 bg-rose-50 text-rose-500 rounded-2xl flex items-center justify-center mb-6">
                            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"/></svg>
                        </div>
                        <h3 class="text-xl font-black text-slate-800">고급 (Expert)</h3>
                        <p class="text-slate-400 text-sm mt-2">JVM & 멀티스레드 & 예외</p>
                    </button>
                </div>
            </div>

            <!-- [2] 퀴즈 플레이 -->
            <div id="quiz-screen" class="hidden fade-in">
                <div class="quiz-grid max-w-6xl mx-auto">
                    <div class="space-y-6">
                        <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100 flex justify-between items-center">
                            <div>
                                <span id="category-label" class="text-[10px] font-black text-blue-600 bg-blue-50 px-3 py-1 rounded-lg uppercase mb-2 inline-block">Java Category</span>
                                <div class="text-3xl font-black text-slate-900">Task <span id="q-number">01</span> / 10</div>
                            </div>
                            <div class="text-right">
                                <div id="timer" class="text-2xl font-black text-slate-800 code-font">00:00</div>
                                <div class="text-[10px] font-black text-slate-400 uppercase">Timer</div>
                            </div>
                        </div>

                        <div id="question-card" class="bg-white p-6 md:p-10 rounded-[3rem] shadow-xl border border-slate-100 min-h-[350px] relative">
                            <!-- Question Content -->
                        </div>

                        <div class="flex flex-col sm:flex-row gap-4">
                            <button id="btn-check" onclick="checkAnswer()" class="flex-1 bg-slate-900 text-white py-5 rounded-2xl font-black text-lg hover:bg-black transition-all">정답 제출</button>
                            <button id="btn-next" onclick="nextQuestion()" class="hidden flex-1 bg-blue-600 text-white py-5 rounded-2xl font-black text-lg">다음 문제</button>
                            <button id="btn-result" onclick="showFinalReport()" class="hidden flex-1 bg-emerald-600 text-white py-5 rounded-2xl font-black text-lg">최종 분석 보기</button>
                        </div>
                    </div>

                    <div class="hidden md:block">
                        <div class="bg-slate-900 p-8 rounded-[2.5rem] text-white h-full shadow-2xl">
                            <h4 class="text-slate-500 text-xs font-black uppercase mb-8 tracking-widest">Progress Map</h4>
                            <div id="progress-list" class="space-y-4"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- [3] 결과 분석 리포트 -->
            <div id="result-screen" class="hidden fade-in max-w-3xl mx-auto py-8">
                <div class="bg-white rounded-[3rem] shadow-2xl overflow-hidden border border-slate-100">
                    <div id="rank-header" class="p-12 text-center text-white">
                        <div id="rank-badge-ui" class="rank-badge">RANK: DETERMINING...</div>
                        <h2 class="text-white opacity-60 font-bold uppercase tracking-widest text-sm mb-2">Final Evaluation</h2>
                        <div class="text-8xl font-black mb-4"><span id="score-display">0</span>/100</div>
                        <p id="grade-comment" class="text-lg opacity-90"></p>
                    </div>
                    
                    <div class="p-8 md:p-12 space-y-10">
                        <div class="bg-slate-50 p-6 rounded-3xl border border-slate-100">
                            <h4 class="text-slate-800 font-black text-lg mb-3">🏅 등급 상세 설명</h4>
                            <div id="rank-desc" class="text-slate-600 text-sm leading-relaxed"></div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                            <div>
                                <h4 class="text-slate-800 font-black text-lg mb-4 flex items-center gap-2">
                                    <span class="w-2 h-6 bg-rose-500 rounded-full"></span> 집중 보완 영역
                                </h4>
                                <div id="weakness-box" class="space-y-3"></div>
                            </div>
                            <div>
                                <h4 class="text-slate-800 font-black text-lg mb-4 flex items-center gap-2">
                                    <span class="w-2 h-6 bg-blue-500 rounded-full"></span> 학습 가이드
                                </h4>
                                <div id="recommendation-box" class="text-slate-600 text-sm bg-blue-50 p-5 rounded-2xl"></div>
                            </div>
                        </div>

                        <button onclick="location.reload()" class="w-full bg-slate-900 text-white py-5 rounded-2xl font-black text-xl">다시 도전하기</button>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <script>
        // 대규모 문제 데이터셋 (각 난이도별 10개 이상 유지 가능)
        const allQuizData = {
            easy: [
                { cat: '변수', q: "int count = 10;\n(          ) name = \"Java\";", a: "String", info: "문자열은 String 참조 타입을 사용합니다." },
                { cat: '타입', q: "boolean isActive = (          );\n// '참'을 뜻하는 키워드", a: "true", info: "boolean은 true와 false 두 값만 가집니다." },
                { cat: '조건문', q: "(          ) (x > 5) {\n    System.out.println(\"Hi\");\n}", a: "if", info: "가장 기본적인 조건문 키워드입니다." },
                { cat: '반복문', q: "(          ) (int i=0; i<5; i++) { }", a: "for", info: "정해진 횟수만큼 반복할 때 사용합니다." },
                { cat: '연산자', q: "int result = 10 (          ) 3;\n// 결과가 1이 되는 나머지 연산자", a: "%", info: "%는 나눗셈의 나머지를 구합니다." },
                { cat: '상수', q: "(          ) double PI = 3.14;\n// 값을 변경할 수 없게 만드는 키워드", a: "final", info: "final은 변수를 상수로 만듭니다." },
                { cat: '타입', q: "double d = 3.14;\nint i = (          ) d;\n// 강제 형변환", a: "int", info: "큰 타입에서 작은 타입으로 변환 시 명시적 형변환이 필요합니다." },
                { cat: '기초', q: "System.(          ).println(\"Hello\");", a: "out", info: "표준 출력을 위해 out 객체를 사용합니다." },
                { cat: '배열', q: "int[] arr = (          ) int[5];", a: "new", info: "배열도 객체이므로 new로 생성합니다." },
                { cat: '메서드', q: "public (          ) void main(String[] args)", a: "static", info: "main은 인스턴스 생성 없이 실행되어야 합니다." }
            ],
            medium: [
                { cat: '상속', q: "class Child (          ) Parent { }", a: "extends", info: "클래스 확장은 extends를 사용합니다." },
                { cat: '생성자', q: "public (          )(String name) { \n  this.name = name; \n}", a: "Car", info: "생성자 이름은 클래스 이름과 동일해야 합니다." },
                { cat: '캡슐화', q: "(          ) String secretKey;\n// 외부 접근 제한", a: "private", info: "데이터 보호를 위해 private을 권장합니다." },
                { cat: '다형성', q: "Animal a = (          ) Dog();", a: "new", info: "부모 타입 변수에 자식 객체를 담을 수 있습니다." },
                { cat: '추상화', q: "public (          ) class Animal { }", a: "abstract", info: "추상 클래스는 객체를 직접 생성할 수 없습니다." },
                { cat: '인터페이스', q: "class A (          ) B, C { }", a: "implements", info: "인터페이스 구현은 implements를 씁니다." },
                { cat: '참조', q: "this.name = name;\n// (          )는 자기 자신 객체를 의미", a: "this", info: "인스턴스 멤버에 접근할 때 사용합니다." },
                { cat: '패키지', q: "(          ) java.util.Scanner;", a: "import", info: "다른 패키지의 클래스를 가져옵니다." },
                { cat: '오버라이딩', q: "@(          )\nvoid move() { }", a: "Override", info: "부모 메서드를 재정의함을 명시합니다." },
                { cat: '컬렉션', q: "List<String> list = new (          )<>();", a: "ArrayList", info: "가장 많이 쓰이는 List 구현체입니다." }
            ],
            hard: [
                { cat: '예외처리', q: "try { ... } (          ) (Exception e) { }", a: "catch", info: "발생한 예외를 잡아서 처리합니다." },
                { cat: '제네릭', q: "List(          )String(          ) list;", a: "<>", info: "타입 안정성을 위해 제네릭을 사용합니다." },
                { cat: '멀티스레드', q: "public synchronized (          ) update() { }", a: "void", info: "synchronized는 임계 영역을 설정합니다." },
                { cat: '스레드', q: "Thread t = new Thread((          ) -> { });", a: "()", info: "람다식을 이용해 Runnable을 구현할 수 있습니다." },
                { cat: '예외던지기', q: "void fail() (          ) Exception { }", a: "throws", info: "메서드 밖으로 예외를 던질 때 사용합니다." },
                { cat: 'JVM', q: "// (          ) 캐스팅 : (Child) parent", a: "다운", info: "부모를 자식 타입으로 변환하는 것을 다운캐스팅이라 합니다." },
                { cat: '상수', q: "public (          ) (          ) int MAX = 100;", a: "static final", info: "공유되는 상수를 정의하는 관례입니다." },
                { cat: '메모리', q: "// 객체가 저장되는 공간 : (          )", a: "Heap", info: "new로 생성된 모든 객체는 Heap에 저장됩니다." },
                { cat: '인터페이스', q: "interface A { (          ) void walk(); }", a: "default", info: "인터페이스 내 구현 코드를 가진 메서드 키워드입니다." },
                { cat: 'JVM', q: "// 사용하지 않는 메모리 정리 : (          )", a: "GC", info: "Garbage Collector가 힙 메모리를 관리합니다." }
            ]
        };

        let state = {
            currentSet: [],
            index: 0,
            score: 0,
            timer: 0,
            interval: null,
            wrongCats: {},
            mode: 'pc'
        };

        function toggleMode(mode) {
            state.mode = mode;
            document.body.className = mode === 'pc' ? 'mode-pc' : 'mode-mobile';
            document.getElementById('sw-pc').className = `switch-btn ${mode === 'pc' ? 'active' : ''}`;
            document.getElementById('sw-mb').className = `switch-btn ${mode === 'mobile' ? 'active' : ''}`;
        }

        function startQuiz(diff) {
            // 해당 난이도에서 10문제 추출 (데이터가 부족하면 셔플 후 전체 사용)
            const pool = allQuizData[diff];
            state.currentSet = [...pool].sort(() => Math.random() - 0.5).slice(0, 10);
            state.index = 0; state.score = 0; state.timer = 0; state.wrongCats = {};

            document.getElementById('lobby-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');

            renderProgress();
            renderQuestion();
            startTimer();
        }

        function startTimer() {
            clearInterval(state.interval);
            state.interval = setInterval(() => {
                state.timer++;
                const m = String(Math.floor(state.timer / 60)).padStart(2, '0');
                const s = String(state.timer % 60).padStart(2, '0');
                document.getElementById('timer').innerText = `${m}:${s}`;
            }, 1000);
        }

        function renderProgress() {
            const list = document.getElementById('progress-list');
            list.innerHTML = state.currentSet.map((_, i) => `
                <div id="prog-${i}" class="flex items-center gap-4 opacity-20 transition-all">
                    <div class="w-6 h-6 rounded-full border border-slate-700 flex items-center justify-center font-black text-[10px]">${i+1}</div>
                    <span class="font-bold text-[10px] tracking-widest uppercase">Task ${i+1}</span>
                </div>
            `).join('');
        }

        function renderQuestion() {
            const item = state.currentSet[state.index];
            document.getElementById('q-number').innerText = String(state.index + 1).padStart(2, '0');
            document.getElementById('category-label').innerText = item.cat;

            document.querySelectorAll('[id^="prog-"]').forEach((el, i) => {
                if(i === state.index) el.className = "flex items-center gap-4 opacity-100 text-blue-400 scale-105";
                else if(i < state.index) el.className = "flex items-center gap-4 opacity-50 text-emerald-400";
            });

            // "static final" 처럼 띄어쓰기가 있는 경우도 처리하기 위해 input 크기 조절
            const inputWidth = item.a.length * 15 + 40;
            const codeHtml = item.q.replace('(          )', `<input type="text" id="ans-input" class="blank-input code-font" style="width: ${inputWidth}px" placeholder="???" autocomplete="off">`);
            
            document.getElementById('question-card').innerHTML = `
                <div class="code-container fade-in mb-8">
                    <pre class="text-blue-100 text-lg md:text-xl leading-relaxed code-font whitespace-pre-wrap">${codeHtml}</pre>
                </div>
                <div id="feedback" class="hidden p-6 rounded-3xl border-2 fade-in font-bold"></div>
            `;

            const input = document.getElementById('ans-input');
            input.focus();
            input.addEventListener('keypress', (e) => { if(e.key === 'Enter') checkAnswer(); });

            document.getElementById('btn-check').classList.remove('hidden');
            document.getElementById('btn-next').classList.add('hidden');
            document.getElementById('btn-result').classList.add('hidden');
        }

        function checkAnswer() {
            const input = document.getElementById('ans-input');
            const val = input.value.trim().toLowerCase();
            if(!val) return;

            const item = state.currentSet[state.index];
            // 정답 체크 (여러 단어 공백 허용)
            const isCorrect = val.replace(/\s+/g, '') === item.a.toLowerCase().replace(/\s+/g, '');
            const fb = document.getElementById('feedback');

            input.disabled = true;
            fb.classList.remove('hidden');

            if(isCorrect) {
                state.score += 10;
                fb.className = "p-6 rounded-3xl border-2 bg-emerald-50 border-emerald-100 text-emerald-700 fade-in";
                fb.innerHTML = `✓ 정확합니다! <p class="text-xs font-medium opacity-70 mt-1">${item.info}</p>`;
            } else {
                state.wrongCats[item.cat] = (state.wrongCats[item.cat] || 0) + 1;
                fb.className = "p-6 rounded-3xl border-2 bg-rose-50 border-rose-100 text-rose-700 fade-in";
                fb.innerHTML = `✗ 오답 (정답: ${item.a}) <p class="text-xs font-medium opacity-70 mt-1">${item.info}</p>`;
            }

            document.getElementById('btn-check').classList.add('hidden');
            if(state.index < 9) document.getElementById('btn-next').classList.remove('hidden');
            else document.getElementById('btn-result').classList.remove('hidden');
        }

        function nextQuestion() {
            state.index++;
            renderQuestion();
        }

        function showFinalReport() {
            clearInterval(state.interval);
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('score-display').innerText = state.score;

            const rankUI = document.getElementById('rank-badge-ui');
            const rankHeader = document.getElementById('rank-header');
            const comment = document.getElementById('grade-comment');
            const rankDesc = document.getElementById('rank-desc');

            if(state.score === 100) {
                rankHeader.className = "p-12 text-center bg-indigo-900";
                rankUI.className = "rank-badge rank-master";
                rankUI.innerText = "RANK: MASTER";
                comment.innerText = "당신은 자바의 신입니다. 완벽한 지식을 갖추셨군요.";
                rankDesc.innerHTML = "<b>[Master]</b> 10문항을 모두 맞힌 당신은 자바의 핵심 철학을 완전히 이해하고 있습니다. 어떤 프로젝트에서도 핵심 리더로 활약할 수 있는 수준입니다.";
            } else if(state.score >= 80) {
                rankHeader.className = "p-12 text-center bg-blue-900";
                rankUI.className = "rank-badge rank-expert";
                rankUI.innerText = "RANK: EXPERT";
                comment.innerText = "상위 5%의 실력자입니다. 실무 역량이 매우 뛰어납니다.";
                rankDesc.innerHTML = "<b>[Expert]</b> 자바의 심화 개념까지 능숙하게 다룹니다. 가끔 발생하는 사소한 실수를 줄인다면 완벽한 마스터가 될 수 있습니다.";
            } else if(state.score >= 60) {
                rankHeader.className = "p-12 text-center bg-emerald-900";
                rankUI.className = "rank-badge rank-senior";
                rankUI.innerText = "RANK: SENIOR";
                comment.innerText = "핵심은 파악했습니다. 응용력을 조금 더 길러보세요.";
                rankDesc.innerHTML = "<b>[Senior]</b> 기본적인 개발은 가능하지만, 특정 상황(예외처리, 최적화 등)에서 개념이 흔들릴 수 있습니다. 복습이 필요합니다.";
            } else if(state.score >= 40) {
                rankHeader.className = "p-12 text-center bg-amber-900";
                rankUI.className = "rank-badge rank-junior";
                rankUI.innerText = "RANK: JUNIOR";
                comment.innerText = "학습이 더 필요합니다. 기본서를 다시 정독해보세요.";
                rankDesc.innerHTML = "<b>[Junior]</b> 아직 문법과 키워드의 쓰임새가 혼동되는 단계입니다. 많은 코딩 실습을 통해 감을 익히는 것이 우선입니다.";
            } else {
                rankHeader.className = "p-12 text-center bg-slate-900";
                rankUI.className = "rank-badge rank-beginner";
                rankUI.innerText = "RANK: BEGINNER";
                comment.innerText = "이제 시작입니다. 포기하지 마세요!";
                rankDesc.innerHTML = "<b>[Beginner]</b> 자바의 기본 구조부터 다시 천천히 학습해야 합니다. 객체지향의 개념을 먼저 잡는 것을 추천합니다.";
            }

            const wrongEntries = Object.entries(state.wrongCats);
            document.getElementById('weakness-box').innerHTML = wrongEntries.length ? wrongEntries.map(([cat]) => `<div class="p-3 bg-rose-50 text-rose-700 rounded-xl text-sm font-bold border border-rose-100 flex justify-between"><span>${cat}</span><span class="text-[10px] opacity-50 uppercase">Weak</span></div>`).join('') : `<div class="p-4 bg-emerald-50 text-emerald-700 rounded-xl text-sm font-bold">완벽합니다! 취약점이 없습니다.</div>`;
            document.getElementById('recommendation-box').innerText = state.score === 100 ? "새로운 자바 버전의 신기능(Records, Sealed Classes 등)을 학습해보세요." : "틀린 카테고리의 오답 노트를 작성하고 예제 코드를 직접 타이핑해보세요.";
        }
    </script>
</body>
</html>
